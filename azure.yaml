# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: connectors-integrated-demo-rfp
services:
  function-app:
    host: function
    project: .
    language: csharp
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./infra/scripts/authorize-connections.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./infra/scripts/authorize-connections.sh
      interactive: true
      continueOnError: false
  postdeploy:
    windows:
      shell: pwsh
      run: ./infra/scripts/postdeploy.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./infra/scripts/postdeploy.sh
      interactive: true
      continueOnError: false
